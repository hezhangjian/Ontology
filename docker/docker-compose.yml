name: ontology

services:
  flink-jobmanager:
    image: flink:2.3.0-scala_2.12-java17
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager

  flink-taskmanager:
    image: flink:2.3.0-scala_2.12-java17
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  hugegraph:
    image: hugegraph/hugegraph:1.7.0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/versions >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  hugegraph-hubble:
    image: hugegraph/hubble:1.7.0
    depends_on:
      hugegraph:
        condition: service_healthy
    ports:
      - "8088:8088"

  hugegraph-hubble-bootstrap:
    image: hugegraph/hubble:1.7.0
    depends_on:
      hugegraph-hubble:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        api=http://hugegraph-hubble:8088/api/v1.2/graph-connections
        for attempt in $$(seq 1 60); do
          connections=$$(curl -fsS "$${api}" 2>/dev/null) && break
          sleep 1
        done
        test -n "$${connections:-}"
        if ! printf '%s' "$${connections}" \
          | grep -q '"graph":"hugegraph","host":"hugegraph","port":8080'; then
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"name":"ontology-current","graph":"hugegraph","host":"hugegraph","port":8080}' \
            "$${api}"
        fi
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set ontology http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        for bucket in flink-checkpoints flink-workloads; do
          mc mb --ignore-existing "ontology/$${bucket}"
        done
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.3
    depends_on:
      - opensearch
    environment:
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
    ports:
      - "5601:5601"

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ontology
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ontology
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-adminer:
    image: adminer:5.5.0-standalone
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"

  pulsar:
    image: apachepulsar/pulsar:4.2.3
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8083:8080"
    volumes:
      - ./data/pulsar:/pulsar/data
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  pulsar-bootstrap:
    image: apachepulsar/pulsar:4.2.3
    depends_on:
      pulsar:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        bin/pulsar-admin --admin-url http://pulsar:8080 tenants get ontology >/dev/null 2>&1 || bin/pulsar-admin --admin-url http://pulsar:8080 tenants create ontology --allowed-clusters standalone
    restart: "no"

  skywalking-oap:
    image: apache/skywalking-oap-server:10.4.0
    depends_on:
      - opensearch
    environment:
      JAVA_OPTS: -Xms512m -Xmx512m
      SW_CORE_RECORD_DATA_TTL: "7"
      SW_CORE_METRICS_DATA_TTL: "7"
      SW_NAMESPACE: skywalking
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: opensearch:9200
      SW_TELEMETRY: prometheus
    ports:
      - "11800:11800"
      - "12800:12800"

  skywalking-ui:
    image: apache/skywalking-ui:10.4.0
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8084:8080"

volumes:
  postgres-data:
