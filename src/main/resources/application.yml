spring:
  application:
    name: ontology
  datasource:
    driver-class-name: org.h2.Driver
    password:
    url: jdbc:h2:mem:ontology;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: ontology
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 64MB

server:
  port: 4242

ontology:
  flink:
    host: ${FLINK_HOST:localhost}
    port: ${FLINK_PORT:8081}
  hugegraph:
    host: ${HUGEGRAPH_HOST:localhost}
    port: ${HUGEGRAPH_PORT:8080}
  llm:
    base-url: ${LLM_BASE_URL}
    model: ${LLM_MODEL}
    api-key: ${LLM_API_KEY:}
  minio:
    host: ${MINIO_HOST:localhost}
    port: ${MINIO_PORT:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
  opensearch:
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
  pulsar:
    host: ${PULSAR_HOST:localhost}
    port: ${PULSAR_PORT:6650}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
