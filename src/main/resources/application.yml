spring:
  application:
    name: ontology
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_PASSWORD:ontology}
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ontology}
    username: ${POSTGRES_USER:ontology}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 4242

ontology:
  flink:
    host: ${FLINK_HOST:localhost}
    port: ${FLINK_PORT:8081}
  hugegraph:
    host: ${HUGEGRAPH_HOST:localhost}
    port: ${HUGEGRAPH_PORT:8080}
  opensearch:
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
