spring:
  datasource:
    url: jdbc:h2:mem:ontology;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS control
    driver-class-name: org.h2.Driver
    username: ontology
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

ontology:
  connections:
    encryption-key: ${CONNECTION_MASTER_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  dashboards:
    token-secret: ${APPLICATION_TOKEN_SECRET:ontology-local-token-secret}
  explorer:
    token-secret: ${APPLICATION_TOKEN_SECRET:ontology-local-token-secret}
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    model: ${LLM_MODEL:deepseek-v4-flash}
  messaging:
    consumers-enabled: false
  minio:
    access-key: ${MINIO_ROOT_USER:ontology}
    secret-key: ${MINIO_ROOT_PASSWORD:ontology-local-password}
  pipelines:
    workload-key: ${FLINK_WORKLOAD_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  scheduling:
    enabled: false
  storage:
    bootstrap:
      enabled: false
