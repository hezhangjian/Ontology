spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_PASSWORD:ontology}
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ontology}
    username: ${POSTGRES_USER:ontology}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
