components:
  schemas:
    CreateOntologyReq:
      type: object
      additionalProperties: false
      required:
        - name
        - id
      properties:
        id:
          type: string
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 1024
    UpdateOntologyReq:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 1024
        id:
          $ref: '#/components/schemas/ResourceId'
    OntologyPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Ontology"
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
    Ontology:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - createdAt
        - updatedAt
    CreateDataSetReq:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 1024
        fields:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DataSetField'
    UpdateDataSetReq:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        id:
          type: string
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 1024
        fields:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/DataSetField'
    DataSetPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataSet'
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
    DataSet:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DataSetField'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataSetField:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 1024
        type:
          $ref: '#/components/schemas/PropertyType'
        nullable:
          type: boolean
    CreateObjectTypeReq:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - idField
        - nameField
        - properties
      properties:
        id:
          type: string
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 1024
        idField:
          type: string
          description: Property used as the Object Instance unique identifier.
          maxLength: 32
        nameField:
          type: string
          description: Property used as the Object Instance display name.
          maxLength: 32
        properties:
          type: array
          description: The idField and nameField values must reference property names in this array.
          minItems: 1
          items:
            "$ref": "#/components/schemas/ObjectTypeProperty"
    UpdateObjectTypeReq:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 1024
    ObjectType:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        ontologyId:
          type: string
        description:
          type: string
        idField:
          type: string
        nameField:
          type: string
        properties:
          type: array
          items:
            "$ref": "#/components/schemas/ObjectTypeProperty"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ObjectTypeProperty:
      type: object
      additionalProperties: false
      required:
        - name
        - type
        - required
      properties:
        name:
          type: string
          description: Unique property name within the Object Type.
          minLength: 1
          maxLength: 32
        description:
          type: string
          maxLength: 1024
        type:
          $ref: '#/components/schemas/PropertyType'
        required:
          type: boolean
    PropertyType:
      type: string
      enum:
        - boolean
        - short
        - int
        - long
        - float
        - double
        - string
        - timestamp
        - date
        - datetime
        - json
    CreateObjectInstanceReq:
      type: object
      additionalProperties: false
      required:
        - properties
      properties:
        properties:
          type: object
          description: Values keyed by Object Type property names; idField determines the ID and nameField determines the display name.
          additionalProperties: true
    ObjectInstance:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        objectTypeId:
          type: string
        properties:
          type: object
          additionalProperties: true
          description: Properties keyed by their published business-facing display names.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/ResourceId'
        version:
          type: integer
          format: int64
        correlationId:
          type: string
          format: uuid
        projectionStatus:
          $ref: '#/components/schemas/ObjectInstanceProjectionStatus'
      required:
        - id
        - title
        - type
        - properties
        - version
        - createdAt
        - updatedAt
    ObjectInstancePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObjectInstance'
        total:
          type: integer
          format: int64
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        type:
          $ref: '#/components/schemas/ResourceId'
        totalIsLowerBound:
          type: boolean
        nextCursor:
          type:
            - string
            - 'null'
      required:
        - type
        - items
        - total
        - totalIsLowerBound
    UpdateObjectInstanceReq:
      type: object
      additionalProperties: false
      required:
        - properties
      properties:
        properties:
          type: object
          description: Values keyed by Object Type property names; idField cannot be changed.
          additionalProperties: true
    ActionExecution:
      type: object
      properties:
        id:
