openapi: 3.1.0
info:
  title: Ontology OpenAPI
  description: Ontology OpenAPI Specification
  version: 0.0.1
servers:
  - url: http://localhost:4242
    description: Local development server
tags:
  - name: Ontology
  - name: DataSet
  - name: ObjectType
  - name: ObjectInstance
  - name: Conversation
  - name: Dashboard
  - name: DataConnection
  - name: Dataset
  - name: Explorer
  - name: Modeling
  - name: Pipeline
  - name: ProjectionAdmin
  - name: RelationInstance
paths:
  "/v1/ontologies":
    get:
      tags:
        - Ontology
      summary: List Ontologies
      operationId: listOntologies
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Visible Ontologies
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OntologyPage"
    post:
      tags:
        - Ontology
      summary: Create an Ontology
      operationId: createOntology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateOntologyReq"
      responses:
        "201":
          description: Created Ontology
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ontology"
  "/v1/ontologies/{ontologyId}":
    get:
      tags:
        - Ontology
      summary: Get an Ontology
      operationId: getOntology
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: Ontology
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ontology"
    patch:
      tags:
        - Ontology
      summary: Update an Ontology
      operationId: updateOntology
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateOntologyReq"
      responses:
        "200":
          description: Updated Ontology
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ontology"
    delete:
      tags:
        - Ontology
      summary: Delete an Ontology
      operationId: deleteOntology
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        "204":
          description: Deleted Ontology
    parameters:
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/datasets:
    get:
      tags:
        - DataSet
        - Dataset
      summary: List DataSets
      operationId: listDataSets
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: DataSets in the Ontology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSetPage'
    post:
      tags:
        - DataSet
        - Dataset
      summary: Create a DataSet
      description: Creates a DataSet.
      operationId: createDataSet
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataSetReq'
      responses:
        '201':
          description: Created DataSet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
    parameters:
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/datasets/{datasetId}:
    get:
      tags:
        - DataSet
        - Dataset
      summary: Get a DataSet
      operationId: getDataSet
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        '200':
          description: DataSet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
    patch:
      tags:
        - DataSet
        - Dataset
      summary: Update a DataSet
      description: Updates metadata for Pipeline DataSets. Replaces fields and rows for Manual DataSets.
      operationId: updateDataSet
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
            maxLength: 32
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataSetReq'
      responses:
        '200':
          description: Updated DataSet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSet'
    delete:
      tags:
        - DataSet
        - Dataset
      summary: Delete a DataSet
      operationId: deleteDataSet
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - in: path
          name: datasetId
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        '204':
          description: Deleted DataSet
    parameters:
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/OntologyId'
  "/v1/ontologies/{ontologyId}/object-types":
    get:
      tags:
        - ObjectType
      summary: List Object Types
      operationId: listObjectTypes
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Object Types in the Ontology
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ObjectType"
    post:
      tags:
        - ObjectType
      summary: Create an Object Type
      operationId: createObjectType
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateObjectTypeReq"
      responses:
        "201":
          description: Created Object Type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ObjectType"
    parameters:
      - $ref: '#/components/parameters/OntologyId'
  "/v1/ontologies/{ontologyId}/object-types/{objectTypeId}":
    get:
      tags:
        - ObjectType
      summary: Get an Object Type
      operationId: getObjectType
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - in: path
          name: objectTypeId
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: Object Type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ObjectType"
    patch:
      tags:
        - ObjectType
      summary: Update an Object Type
      operationId: updateObjectType
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - in: path
          name: objectTypeId
          required: true
          schema:
            type: string
            maxLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateObjectTypeReq"
      responses:
        "200":
          description: Updated Object Type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ObjectType"
    delete:
      tags:
        - ObjectType
      summary: Delete an Object Type
      operationId: deleteObjectType
      parameters:
        - in: path
          name: ontologyId
          required: true
          schema:
            type: string
            maxLength: 32
        - in: path
          name: objectTypeId
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        "204":
          description: Deleted Object Type
    parameters:
      - $ref: '#/components/parameters/ObjectTypeId'
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/object-types/{objectTypeId}/object-instances:
    get:
      tags:
        - ObjectInstance
      summary: List Object Instances
      operationId: listObjectInstances
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Object Instance Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectInstancePage'
    post:
      tags:
        - ObjectInstance
      summary: Create an Object Instance
      operationId: createObjectInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObjectInstanceReq'
      responses:
        '201':
          description: Created Object Instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectInstance'
          headers:
            ETag:
              schema:
                type: string
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
    parameters:
      - name: ontologyId
        in: path
        required: true
        schema:
          type: string
          maxLength: 32
      - name: objectTypeId
        in: path
        required: true
        schema:
          type: string
          maxLength: 32
  /v1/ontologies/{ontologyId}/object-types/{objectTypeId}/object-instances/{objectInstanceId}:
    get:
      tags:
        - ObjectInstance
      summary: Get an Object Instance
      operationId: getObjectInstance
      responses:
        '200':
          description: Object Instance
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectInstance'
    patch:
      tags:
        - ObjectInstance
      summary: Update an Object Instance
      description: Merge patch; null removes an override and the primary key is immutable.
      operationId: updateObjectInstance
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateObjectInstanceReq'
      responses:
        '200':
          description: Updated Object Instance
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectInstance'
    delete:
      tags:
        - ObjectInstance
      summary: Delete an Object Instance
      operationId: deleteObjectInstance
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted Object Instance
    parameters:
      - name: ontologyId
        in: path
        required: true
        schema:
          type: string
          maxLength: 32
      - name: objectTypeId
        in: path
        required: true
        schema:
          type: string
          maxLength: 32
      - name: objectInstanceId
        in: path
        required: true
        schema:
          type: string
          maxLength: 32
  /v1/ontologies/{ontologyId}/action-executions:
    get:
      tags:
        - Modeling
      summary: List Action Executions
      operationId: actionExecutions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List Action Executions response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionExecution'
    parameters:
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/action-executions/{id}:
    get:
      tags:
        - Modeling
      summary: Get an Action Execution
      operationId: actionExecution
      responses:
        '200':
          description: Get an Action Execution response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionExecution'
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/action-types:
    get:
      tags:
        - Modeling
      summary: List Action Types
      operationId: listActionTypes
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List Action Types response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceView'
    post:
      tags:
        - Modeling
      summary: Create Action
      operationId: createAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDraftRequest'
        required: true
      responses:
        '201':
          description: Create Action response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceView'
    parameters:
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/action-types/{id}:
    get:
      tags:
        - Modeling
      summary: Get an Action Type
      operationId: action
      responses:
        '200':
          description: Get an Action Type response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceView'
    patch:
      tags:
        - Modeling
      summary: Update Action
      operationId: updateAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceIdentityRequest'
        required: true
      responses:
        '200':
          description: Update Action response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceView'
    delete:
      tags:
        - Modeling
      summary: Delete Action
      operationId: deleteAction
      responses:
        '204':
          description: Delete Action response
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/action-types/{id}/executions:
    post:
      tags:
        - Modeling
      summary: Execute Action
      operationId: executeAction
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionExecuteRequest'
        required: true
      responses:
        '202':
          description: Execute Action response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionExecution'
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/action-types/{id}/previews:
    post:
      tags:
        - Modeling
      summary: Preview Action
      operationId: previewAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPreviewRequest'
      responses:
        '200':
          description: Preview Action response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPreview'
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/agents/{agentId}/conversations:
    get:
      tags:
        - Conversation
      summary: List Conversations
      operationId: listConversations
      responses:
        '200':
          description: List Conversations response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      tags:
        - Conversation
      summary: Create Conversation
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/agents/{agentId}/conversations/{id}:
    get:
      tags:
        - Conversation
      summary: Get Conversation
      operationId: getConversation
      responses:
        '200':
          description: Get Conversation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/agents/{agentId}/conversations/{id}/action-confirmations:
    post:
      tags:
        - Conversation
      summary: Confirm Action
      operationId: confirmAction
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmActionRequest'
        required: true
      responses:
        '200':
          description: Confirm Action response
          content:
            application/json:
              schema:
                type: object
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/agents/{agentId}/conversations/{id}/confirm-rule-transform:
    post:
      tags:
        - Conversation
      summary: Confirm Rule Transform
      operationId: confirmRuleTransform
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        '200':
          description: Confirm Rule Transform response
          content:
            application/json:
              schema:
                type: object
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/agents/{agentId}/conversations/{id}/messages:
    post:
      tags:
        - Conversation
      summary: Send a Message
      operationId: send
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseEmitter'
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/connection-tests:
    post:
      tags:
        - DataConnection
      summary: Test a Connection
      operationId: test
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRequest'
        required: true
      responses:
        '200':
          description: Test a Connection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
    parameters:
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/connections:
    get:
      tags:
        - DataConnection
      summary: List Connections
      operationId: listConnections
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: owner
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List Connections response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourcePage'
    post:
      tags:
        - DataConnection
      summary: Create Connection
      operationId: createConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        '200':
          description: Create Connection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
    parameters:
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/connections/{id}:
    get:
      tags:
        - DataConnection
      summary: Get Connection
      operationId: getConnection
      responses:
        '200':
          description: Get Connection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
    patch:
      tags:
        - DataConnection
      summary: Update Connection
      operationId: updateConnection
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
        required: true
      responses:
        '200':
          description: Update Connection response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
    delete:
      tags:
        - DataConnection
      summary: Delete Connection
      operationId: deleteConnection
      responses:
        '200':
          description: Delete Connection response
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/OntologyId'
  /v1/ontologies/{ontologyId}/connections/{id}/assets:
    get:
      tags:
        - DataConnection
      summary: List Connection Assets
      operationId: listConnectionAssets
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List Connection Assets response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
